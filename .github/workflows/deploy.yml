name: Foodgram CI/CD

on:
  push:
    branches:
      - main

jobs:
  build_and_push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: adhqulm/foodgram-backend:latest
          cache-from: type=registry,ref=adhqulm/foodgram-backend:buildcache
          cache-to: type=registry,ref=adhqulm/foodgram-backend:buildcache,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: adhqulm/foodgram-frontend:latest
          cache-from: type=registry,ref=adhqulm/foodgram-frontend:buildcache
          cache-to: type=registry,ref=adhqulm/foodgram-frontend:buildcache,mode=max

  deploy:
    name: Deploy to Remote Server
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "docker-compose.prod.yml,infra/nginx.conf,data/ingredients.csv,data/ingredients_en.csv,.env.prod"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy and setup database
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            cp .env.prod .env

            sudo docker pull adhqulm/foodgram-backend:latest
            sudo docker pull adhqulm/foodgram-frontend:latest

            sudo docker compose -f docker-compose.prod.yml down --remove-orphans || true

            sudo fuser -k 443/tcp || true
            sudo fuser -k 80/tcp || true

            sleep 2

            sudo docker compose -f docker-compose.prod.yml up -d

            sleep 10

            sudo docker compose -f docker-compose.prod.yml exec -T backend python manage.py migrate --noinput

            sudo docker compose -f docker-compose.prod.yml exec -T backend python manage.py collectstatic --noinput

            sudo docker compose -f docker-compose.prod.yml exec -T backend python manage.py load_ingredients

            sudo docker compose -f docker-compose.prod.yml exec -T backend python manage.py load_ingredients_en

            sudo docker compose -f docker-compose.prod.yml exec -T backend python manage.py shell -c "
            from recipes.models import Tag
            tags_data = [
                {'name': 'Завтрак', 'slug': 'breakfast'},
                {'name': 'Обед', 'slug': 'lunch'},
                {'name': 'Ужин', 'slug': 'dinner'},
                {'name': 'Десерт', 'slug': 'dessert'},
                {'name': 'Салат', 'slug': 'salad'},
                {'name': 'Закуска', 'slug': 'appetizer'}
            ]
            for tag_data in tags_data:
                Tag.objects.get_or_create(**tag_data)
            print('Tags setup complete')
            "

            sudo docker compose -f docker-compose.prod.yml ps

      - name: Send deployment notification
        if: success()
        run: echo "Deployment successful!"
