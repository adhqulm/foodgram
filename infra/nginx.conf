server {
    listen 80;
    server_name foodgram.bar www.foodgram.bar;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name foodgram.bar www.foodgram.bar;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/foodgram.bar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foodgram.bar/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/foodgram.bar/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    location /api/ {
        resolver 127.0.0.11 valid=30s; 
        set $upstream_backend backend; 

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://$upstream_backend:8000;
    }

    location /admin/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_backend backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_pass http://$upstream_backend:8000; 
    }

    location /media/ {
        alias /var/html/media/;
    }

    location /static/admin/ {
        alias /var/html/static/admin/;
    }

    location /static/rest_framework/ {
        alias /var/html/static/rest_framework/;
    }

    location / {
        root /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/html/frontend/;
    }
}
